name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: write   # required to create/update GitHub Releases
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Verify version coherence + tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python tools/check_version_coherence.py --tag "$REF_NAME"
      - name: Gate on the full test suite
        run: python tools/run_tests.py
      - name: Gate on v1 downstream readiness
        run: python tools/check_v1_readiness.py
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" dist/* --clobber
          else
            gh release create "$REF_NAME" dist/* --title "$REF_NAME" --generate-notes --latest
          fi
