name: Standards check

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the drift check when a Docs-Unaffected waiver is added to the description.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: Structural lint (v1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the drift check needs full history (ADR-0023)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run standards check
        env:
          # Untrusted PR text reaches the script only through env, never the shell.
          STANDARDS_PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/standards-check/check.py --drift-base "origin/$BASE_REF"
          else
            python scripts/standards-check/check.py
          fi

  test:
    name: Tests (py${{ matrix.python-version }})
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all test suites
        run: python tools/run_tests.py

  build-smoke:
    name: Build wheel + init smoke
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install wheel into a clean venv and adopt a temp repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/standards init --profile library /tmp/adopted
          test -f /tmp/adopted/docs/STANDARDS.md
          test -f /tmp/adopted/.standards-kit.json
          test -f /tmp/adopted/AGENTS.md
