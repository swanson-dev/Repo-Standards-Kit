name: Kit guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coherence:
    name: Version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check version coherence
        run: python tools/check_version_coherence.py
