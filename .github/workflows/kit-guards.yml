name: Kit guards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dev tooling
        run: python -m pip install --upgrade ruff mypy
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/standards

  coherence:
    name: Version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check version coherence
        run: python tools/check_version_coherence.py

  v1-readiness:
    name: V1 readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate generated downstream profiles
        run: python tools/check_v1_readiness.py
