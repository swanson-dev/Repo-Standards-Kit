name: External link check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run opt-in external link check
        run: python scripts/standards-check/check.py --external-links
